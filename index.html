<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT Owner — Управление составом</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #F7F8FB;
            color: #12141C;
            min-height: 100vh;
        }

        /* --- Авторизация --- */
        #authSection {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            background: #FFFFFF;
            padding: 2.25rem 2rem;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(16, 24, 40, 0.10);
            width: 100%;
            max-width: 400px;
            border: 1px solid #E7E9EE;
        }

        .login-card h2 {
            margin-bottom: 0.4rem;
            text-align: left;
            color: #12141C;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .login-card .sub {
            color: #6B7280;
            font-size: 0.88rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #9CA3AF;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.7rem 0.85rem;
            border-radius: 8px;
            border: 1px solid #E7E9EE;
            background-color: #F7F8FB;
            color: #12141C;
            font-size: 0.95rem;
            outline: none;
            transition: border-color .15s, box-shadow .15s, background-color .15s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #4F46E5;
            box-shadow: 0 0 0 3px #EEF0FF;
            background-color: #fff;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #12141C;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover { background-color: #000; }
        .btn:disabled { background-color: #C7CAD1; cursor: not-allowed; }
        .btn-danger { background-color: #DC2626; }
        .btn-danger:hover { background-color: #B91C1C; }

        .status-msg {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.85rem;
            min-height: 1.2em;
            font-weight: 500;
        }
        .status-msg.error { color: #DC2626; }
        .status-msg.success { color: #16A34A; }
        .status-msg.info { color: #4F46E5; }

        /* --- Дашборд --- */
        #dashboardSection {
            display: none;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid #E7E9EE;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
        }

        .panel {
            background: #FFFFFF;
            padding: 1.5rem;
            border-radius: 14px;
            border: 1px solid #E7E9EE;
            box-shadow: 0 1px 2px rgba(16,24,40,.04);
            height: fit-content;
        }

        .panel h3 {
            margin-bottom: 1rem;
            color: #12141C;
            font-size: 1rem;
            font-weight: 700;
        }

        .staff-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.25rem;
        }

        .staff-table th, .staff-table td {
            padding: 0.85rem 0.75rem;
            text-align: left;
            border-bottom: 1px solid #E7E9EE;
        }

        .staff-table th {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background-color: #F7F8FB;
            color: #9CA3AF;
        }

        .staff-table tbody tr:hover {
            background-color: #FBFBFD;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            vertical-align: middle;
            margin-right: 10px;
            box-shadow: 0 0 0 1px #E7E9EE;
        }

        .badge {
            padding: 0.28rem 0.6rem;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .badge-admin { background: #F5F3FF; color: #7C3AED; }
        .badge-mod { background: #ECFDF5; color: #059669; }
        .badge-intern { background: #FFF7ED; color: #D97706; }
    </style>
</head>
<body>

    <!-- СЕКЦИЯ АВТОРИЗАЦИИ -->
    <div id="authSection">
        <div class="login-card">
            <h2>FT Owner Admin</h2>
            <p class="sub">Введите ваши учётные данные для входа</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Логин</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" id="submitBtn" class="btn">Войти</button>
            </form>
            <div id="statusMsg" class="status-msg"></div>
        </div>
    </div>

    <!-- СЕКЦИЯ ДАШБОРДА -->
    <div id="dashboardSection">
        <header>
            <h1>FT Owner — Управление составом</h1>
            <button id="logoutBtn" class="btn btn-danger" style="width: auto; padding: 0.55rem 1.1rem;">Выйти</button>
        </header>

        <div class="dashboard-grid">
            <!-- Панель добавления сотрудников -->
            <div class="panel">
                <h3>Добавить сотрудника</h3>
                <form id="addStaffForm">
                    <div class="form-group">
                        <label>Никнейм Minecraft</label>
                        <input type="text" id="staffNick" required placeholder="Player">
                    </div>
                    <div class="form-group">
                        <label>Должность</label>
                        <select id="staffRank">
                            <option value="Стажёр">Стажёр</option>
                            <option value="Модератор">Модератор</option>
                            <option value="Администратор">Администратор</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Telegram ID / Юзернейм</label>
                        <input type="text" id="staffTg" placeholder="@username">
                    </div>
                    <button type="submit" class="btn">Добавить</button>
                </form>
            </div>

            <!-- Список сотрудников -->
            <div class="panel">
                <h3>Состав персонала</h3>
                <table class="staff-table">
                    <thead>
                        <tr>
                            <th>Игрок</th>
                            <th>Должность</th>
                            <th>Telegram</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody id="staffList">
                        <!-- Список рендерится через JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://shy-wood-231f.potapovsasko.workers.dev";

        const authSection = document.getElementById("authSection");
        const dashboardSection = document.getElementById("dashboardSection");
        const loginForm = document.getElementById("loginForm");
        const submitBtn = document.getElementById("submitBtn");
        const statusMsg = document.getElementById("statusMsg");
        const logoutBtn = document.getElementById("logoutBtn");

        const addStaffForm = document.getElementById("addStaffForm");
        const staffList = document.getElementById("staffList");

        let staffData = JSON.parse(localStorage.getItem("ft_staff_data")) || [
            { nick: "snyper", rank: "Администратор", tg: "@snyper" }
        ];

        // Проверка авторизации при загрузке
        if (localStorage.getItem("ft_authenticated") === "true") {
            showDashboard();
        }

        // Авторизация
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const login = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            setStatus("Проверка данных...", "info");
            submitBtn.disabled = true;

            try {
                const res = await fetch(`${WORKER_URL}/api/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ login, password })
                });

                const data = await res.json();

                if (!data.success) {
                    setStatus(data.error || "Ошибка входа", "error");
                    submitBtn.disabled = false;
                    return;
                }

                setStatus("Подтвердите вход в Telegram...", "info");
                startPolling(data.sessionId);

            } catch (err) {
                setStatus("Ошибка соединения", "error");
                submitBtn.disabled = false;
            }
        });

        function startPolling(sessionId) {
            const pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${WORKER_URL}/api/check-status?sessionId=${sessionId}`);
                    const data = await res.json();

                    if (data.status === "approved") {
                        clearInterval(pollInterval);
                        localStorage.setItem("ft_authenticated", "true");
                        showDashboard();
                    } else if (data.status === "denied") {
                        clearInterval(pollInterval);
                        setStatus("Вход отклонён!", "error");
                        submitBtn.disabled = false;
                    } else if (data.status === "expired") {
                        clearInterval(pollInterval);
                        setStatus("Время ожидания истекло", "error");
                        submitBtn.disabled = false;
                    }
                } catch (err) {
                    console.error("Ошибка опроса:", err);
                }
            }, 2000);
        }

        function setStatus(text, type) {
            statusMsg.textContent = text;
            statusMsg.className = `status-msg ${type}`;
        }

        function showDashboard() {
            authSection.style.display = "none";
            dashboardSection.style.display = "block";
            renderStaff();
        }

        // Выход
        logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("ft_authenticated");
            location.reload();
        });

        // Работа с персоналом
        addStaffForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const nick = document.getElementById("staffNick").value.trim();
            const rank = document.getElementById("staffRank").value;
            const tg = document.getElementById("staffTg").value.trim() || "-";

            staffData.push({ nick, rank, tg });
            saveAndRender();
            addStaffForm.reset();
        });

        function deleteStaff(index) {
            staffData.splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem("ft_staff_data", JSON.stringify(staffData));
            renderStaff();
        }

        function renderStaff() {
            staffList.innerHTML = "";
            staffData.forEach((item, index) => {
                const tr = document.createElement("tr");

                let badgeClass = "badge-intern";
                if (item.rank === "Администратор") badgeClass = "badge-admin";
                if (item.rank === "Модератор") badgeClass = "badge-mod";

                tr.innerHTML = `
                    <td>
                        <img class="avatar" src="https://mc-heads.net/avatar/${item.nick}/32" alt="skin">
                        <strong>${item.nick}</strong>
                    </td>
                    <td><span class="badge ${badgeClass}">${item.rank}</span></td>
                    <td>${item.tg}</td>
                    <td>
                        <button class="btn btn-danger" style="padding: 0.25rem 0.5rem; font-size: 0.8rem; width: auto;" onclick="deleteStaff(${index})">Удалить</button>
                    </td>
                `;
                staffList.appendChild(tr);
            });
        }
    </script>
</body>
</html>
