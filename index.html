<script>
/* =========================================================
   FT OWNER — ГОТОВЫЙ SCRIPT
   ========================================================= */

const WORKER_URL = "https://shy-wood-231f.potapovsasko.workers.dev";

let staffData = [];
let coauthorsData = [];
let articlesData = [];

let currentFilter = "Все";
let currentStaffSearch = "";
let editIndex = null;
let editCoauthorIdx = null;
let pendingAvatar = null;

let editingArticleId = null;
let articleButtons = [];

const rankClass = {
  "Бета": "r-beta",
  "Беta": "r-beta",
  "Альфа": "r-alpha",
  "Стажёр": "r-stazher",
  "Метод": "r-metod"
};

const pageTitles = {
  home: {
    title: "Главная",
    sub: "Общая информация и панель управления."
  },
  staff: {
    title: "Сотрудники",
    sub: "Команда, которая работает для сервера FunTime."
  },
  hydes: {
    title: "Хайды",
    sub: "Закрытые инструкции и руководства."
  },
  access: {
    title: "Доступ",
    sub: "Управление соавторами и правами доступа."
  },
  payments: {
    title: "Мои выплаты",
    sub: "История выплат и баланс."
  },
  forbidden: {
    title: "Ошибка доступа",
    sub: "Недостаточно прав."
  }
};

/* =========================================================
   УТИЛИТЫ
   ========================================================= */

function getRole() {
  return localStorage.getItem("ft_role") || "admin";
}

function getUsername() {
  return localStorage.getItem("ft_username") || "";
}

function getPermissions() {
  try {
    return JSON.parse(localStorage.getItem("ft_permissions") || "[]");
  } catch {
    return [];
  }
}

function isAdmin() {
  return getRole() === "admin";
}

function hasPermission(permission) {
  return isAdmin() || getPermissions().includes(permission);
}

function escapeHtml(value) {
  if (value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function generateId() {
  return (
    Date.now().toString(36) +
    Math.random().toString(36).substring(2, 10)
  );
}

function formatDate(date) {
  if (!date) return "";

  try {
    return new Date(date).toLocaleString("ru-RU", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  } catch {
    return "";
  }
}

/* =========================================================
   АВТОРИЗАЦИЯ
   ========================================================= */

if (localStorage.getItem("ft_authenticated") === "true") {
  showDashboard();
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const login = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  const statusMsg = document.getElementById("statusMsg");
  const submitBtn = document.getElementById("submitBtn");

  statusMsg.textContent = "Проверка данных...";
  statusMsg.className = "status-msg info";

  submitBtn.disabled = true;

  try {
    const res = await fetch(`${WORKER_URL}/api/login`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        login,
        password
      })
    });

    const data = await res.json();

    if (!data.success) {
      statusMsg.textContent = data.error || "Ошибка входа";
      statusMsg.className = "status-msg error";
      submitBtn.disabled = false;
      return;
    }

    if (
      data.status === "deleted" ||
      data.status === "blocked"
    ) {
      statusMsg.textContent =
        "Ошибка: аккаунт заблокирован или удалён.";
      statusMsg.className = "status-msg error";
      submitBtn.disabled = false;
      return;
    }

    localStorage.setItem("ft_username", login);
    localStorage.setItem(
      "ft_role",
      data.role || "admin"
    );

    localStorage.setItem(
      "ft_permissions",
      JSON.stringify(
        data.permissions || [
          "staff",
          "staff_add",
          "staff_actions",
          "hydes",
          "access",
          "payments",
          "home",
          "create_articles"
        ]
      )
    );

    statusMsg.textContent =
      "Подтвердите вход в Telegram...";
    statusMsg.className = "status-msg info";

    startPolling(data.sessionId);

  } catch (err) {
    console.error(err);

    statusMsg.textContent =
      "Ошибка соединения с сервером.";
    statusMsg.className = "status-msg error";

    submitBtn.disabled = false;
  }
});

function startPolling(sessionId) {
  const pollInterval = setInterval(async () => {
    try {
      const res = await fetch(
        `${WORKER_URL}/api/check-status?sessionId=${encodeURIComponent(sessionId)}`
      );

      const data = await res.json();

      if (data.status === "approved") {
        clearInterval(pollInterval);

        localStorage.setItem(
          "ft_authenticated",
          "true"
        );

        showDashboard();

      } else if (
        data.status === "denied" ||
        data.status === "expired"
      ) {
        clearInterval(pollInterval);

        document.getElementById("statusMsg").textContent =
          "Вход отклонён или время истекло.";

        document.getElementById("statusMsg").className =
          "status-msg error";

        document.getElementById("submitBtn").disabled =
          false;
      }

    } catch (e) {
      console.error(e);
    }
  }, 2000);
}

/* =========================================================
   DASHBOARD
   ========================================================= */

async function showDashboard() {
  document.getElementById("authSection").style.display = "none";
  document.getElementById("dashboardSection").style.display = "block";

  const name = getUsername() || "Пользователь";

  document.getElementById("userNameLabel").textContent =
    name;

  document.getElementById("userInitial").textContent =
    name.charAt(0).toUpperCase();

  addStaffSearch();
  buildHydesInterface();
  addCreateArticlesPermissionToAccess();

  await loadServerData();

  applySidebarVisibility();
}

function applySidebarVisibility() {
  const role = getRole();
  const permissions = getPermissions();

  const pages = [
    "staff",
    "hydes",
    "access",
    "payments"
  ];

  pages.forEach(page => {
    const item =
      document.getElementById(`nav-${page}`);

    if (!item) return;

    if (
      role === "admin" ||
      permissions.includes(page)
    ) {
      item.style.display = "flex";
    } else {
      item.style.display = "none";
    }
  });
}

/* =========================================================
   ВЫХОД
   ========================================================= */

document.getElementById("logoutBtn")
  .addEventListener("click", () => {
    localStorage.clear();
    location.reload();
  });

/* =========================================================
   НАВИГАЦИЯ
   ========================================================= */

document
  .querySelectorAll(".sidebar .nav-item[data-page]")
  .forEach(item => {

    item.addEventListener("click", e => {
      e.preventDefault();

      const page = item.dataset.page;

      document
        .querySelectorAll(".sidebar .nav-item")
        .forEach(el =>
          el.classList.remove("active")
        );

      item.classList.add("active");

      document
        .querySelectorAll(".page-view")
        .forEach(v =>
          v.classList.remove("active-page")
        );

      const role = getRole();
      const permissions = getPermissions();

      if (
        role === "admin" ||
        permissions.includes(page) ||
        page === "home"
      ) {

        const target =
          document.getElementById(`view-${page}`);

        if (target) {
          target.classList.add("active-page");
        }

        updateTopbar(page);

        if (page === "hydes") {
          renderArticles();
        }

      } else {

        document
          .getElementById("view-forbidden")
          .classList.add("active-page");

        updateTopbar("forbidden");
      }
    });
  });

function updateTopbar(pageKey) {
  const info =
    pageTitles[pageKey] || {
      title: "Раздел",
      sub: ""
    };

  document.getElementById("pageTitle")
    .textContent = info.title;

  document.getElementById("pageSub")
    .textContent = info.sub;
}

/* =========================================================
   ЗАГРУЗКА ДАННЫХ
   ========================================================= */

async function loadServerData() {

  try {

    const res =
      await fetch(`${WORKER_URL}/api/data`);

    const data =
      await res.json();

    if (data.success) {

      staffData =
        Array.isArray(data.staff)
          ? data.staff
          : [];

      coauthorsData =
        Array.isArray(data.coauthors)
          ? data.coauthors
          : [];

      articlesData =
        Array.isArray(data.articles)
          ? data.articles
          : [];
    }

  } catch (e) {

    console.error(
      "Ошибка загрузки данных:",
      e
    );

    staffData =
      JSON.parse(
        localStorage.getItem(
          "ft_staff_data"
        )
      ) || [];

    coauthorsData =
      JSON.parse(
        localStorage.getItem(
          "ft_coauthors_data"
        )
      ) || [];

    articlesData =
      JSON.parse(
        localStorage.getItem(
          "ft_articles_data"
        )
      ) || [];
  }

  const currentLogin =
    getUsername();

  const role =
    getRole();

  if (
    role !== "admin" &&
    currentLogin
  ) {

    const me =
      coauthorsData.find(
        c =>
          c.login === currentLogin
      );

    if (me) {

      localStorage.setItem(
        "ft_permissions",
        JSON.stringify(
          me.permissions || []
        )
      );

      applySidebarVisibility();
    }
  }

  renderStaff();
  renderCoauthors();
  renderArticles();
}

/* =========================================================
   СОХРАНЕНИЕ ДАННЫХ
   ========================================================= */

async function saveServerData() {

  localStorage.setItem(
    "ft_staff_data",
    JSON.stringify(staffData)
  );

  localStorage.setItem(
    "ft_coauthors_data",
    JSON.stringify(coauthorsData)
  );

  localStorage.setItem(
    "ft_articles_data",
    JSON.stringify(articlesData)
  );

  try {

    await fetch(`${WORKER_URL}/api/data`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        staff: staffData,
        coauthors: coauthorsData,
        articles: articlesData
      })
    });

  } catch (e) {
    console.error(
      "Ошибка сохранения:",
      e
    );
  }

  renderStaff();
  renderCoauthors();
  renderArticles();
}

/* =========================================================
   ПОИСК СОТРУДНИКОВ
   ========================================================= */

function addStaffSearch() {

  const staffView =
    document.getElementById(
      "view-staff"
    );

  if (!staffView) return;

  if (
    document.getElementById(
      "staffSearch"
    )
  ) return;

  const tabs =
    document.getElementById("tabs");

  if (!tabs) return;

  const searchBox =
    document.createElement("div");

  searchBox.style.cssText = `
    margin-bottom:15px;
    display:flex;
    width:100%;
  `;

  searchBox.innerHTML = `
    <input
      id="staffSearch"
      type="text"
      placeholder="🔎 Поиск сотрудника по нику..."
      style="
        width:100%;
        padding:11px 14px;
        border:1px solid var(--border);
        border-radius:9px;
        background:var(--surface);
        color:var(--text);
        outline:none;
        font-size:.9rem;
      "
    >
  `;

  tabs.parentNode.insertBefore(
    searchBox,
    tabs
  );

  document
    .getElementById("staffSearch")
    .addEventListener(
      "input",
      e => {

        currentStaffSearch =
          e.target.value
            .trim()
            .toLowerCase();

        renderStaff();
      }
    );
}

/* =========================================================
   СОТРУДНИКИ
   ========================================================= */

document.querySelectorAll(".tab")
  .forEach(tab => {

    tab.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".tab")
          .forEach(t =>
            t.classList.remove(
              "active"
            )
          );

        tab.classList.add("active");

        currentFilter =
          tab.dataset.filter;

        renderStaff();
      }
    );
  });

function renderStaff() {

  const tbody =
    document.getElementById(
      "staffList"
    );

  if (!tbody) return;

  let filtered =
    staffData.filter(s => {

      const ranks =
        s.ranks ||
        (s.rank ? [s.rank] : []);

      if (
        currentFilter !== "Все" &&
        !ranks.includes(
          currentFilter
        )
      ) {
        return false;
      }

      if (
        currentStaffSearch &&
        !String(
          s.nick || ""
        )
          .toLowerCase()
          .includes(
            currentStaffSearch
          )
      ) {
        return false;
      }

      return true;
    });

  const role = getRole();
  const permissions =
    getPermissions();

  const canAdd =
    role === "admin" ||
    permissions.includes(
      "staff_add"
    );

  const canActions =
    role === "admin" ||
    permissions.includes(
      "staff_actions"
    );

  const footer =
    document.getElementById(
      "staffFooterCard"
    );

  if (footer) {
    footer.style.display =
      canAdd
        ? "flex"
        : "none";
  }

  const actionsHeader =
    document.getElementById(
      "staffActionsHeader"
    );

  if (actionsHeader) {
    actionsHeader.style.display =
      canActions
        ? ""
        : "none";
  }

  if (!filtered.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="5"
          style="
            text-align:center;
            color:var(--text-faint);
            padding:30px;
          ">
          Сотрудники не найдены
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML =
    filtered.map(s => {

      const originalIndex =
        staffData.indexOf(s);

      const ranks =
        s.ranks ||
        (s.rank ? [s.rank] : []);

      const positions =
        s.positions ||
        (s.position
          ? [s.position]
          : []);

      const ranksHtml =
        ranks.map(r => `
          <span class="badge ${
            rankClass[r] ||
            "r-default"
          }">
            ${escapeHtml(r)}
          </span>
        `).join(" ");

      const positionsHtml =
        positions.length
          ? positions.map(p => `
              <span
                class="role-badge role-chip"
                data-value="${escapeHtml(p)}">
                ${escapeHtml(p)}
              </span>
            `).join(" ")
          : "—";

      const avatarSrc =
        s.avatar ||
        "https://via.placeholder.com/32";

      const vkHtml =
        s.vk
          ? `
            <a
              href="${escapeHtml(s.vk)}"
              target="_blank"
              rel="noopener"
              class="vk-link">
              Ссылка
            </a>
          `
          : "—";

      const actionsHtml =
        canActions
          ? `
            <td>
              <div class="row-actions">

                <button
                  class="icon-btn warn"
                  onclick="editStaff(${originalIndex})">
                  Изменить
                </button>

                <button
                  class="icon-btn del"
                  onclick="deleteStaff(${originalIndex})">
                  Удалить
                </button>

              </div>
            </td>
          `
          : "";

      return `
        <tr>

          <td>
            <div class="player-cell">

              <img
                src="${avatarSrc}"
                class="avatar"
                alt="">

              <span class="player-name">
                ${escapeHtml(s.nick)}
              </span>

            </div>
          </td>

          <td>
            ${ranksHtml}
          </td>

          <td>
            ${positionsHtml}
          </td>

          <td>
            ${vkHtml}
          </td>

          ${actionsHtml}

        </tr>
      `;

    }).join("");
}

/* =========================================================
   СОТРУДНИК — ТЕГИ
   ========================================================= */

window.toggleTag = function(btn) {
  btn.classList.toggle("active");
};

function setChipsActive(
  containerId,
  values
) {

  const container =
    document.getElementById(
      containerId
    );

  if (!container) return;

  container
    .querySelectorAll(".tag-chip")
    .forEach(chip => {

      if (
        values.includes(
          chip.dataset.value
        )
      ) {
        chip.classList.add(
          "active"
        );
      } else {
        chip.classList.remove(
          "active"
        );
      }

    });
}

/* =========================================================
   СОТРУДНИК — ДОБАВЛЕНИЕ
   ========================================================= */

const staffModal =
  document.getElementById(
    "staffModalOverlay"
  );

if (
  document.getElementById(
    "openAddModal"
  )
) {

  document
    .getElementById(
      "openAddModal"
    )
    .addEventListener(
      "click",
      () => {

        editIndex = null;

        document.getElementById(
          "modalTitle"
        ).textContent =
          "Добавить сотрудника";

        document.getElementById(
          "staffNick"
        ).value = "";

        document.getElementById(
          "staffVk"
        ).value = "";

        document.getElementById(
          "fileNameLabel"
        ).textContent =
          "Файл не выбран";

        pendingAvatar = null;

        document
          .querySelectorAll(
            "#rankTags .tag-chip, #roleTags .tag-chip"
          )
          .forEach(el =>
            el.classList.remove(
              "active"
            )
          );

        staffModal.classList.add(
          "open"
        );
      }
    );
}

function closeStaffModal() {
  if (staffModal) {
    staffModal.classList.remove(
      "open"
    );
  }
}

document
  .getElementById(
    "cancelModalBtn"
  )
  ?.addEventListener(
    "click",
    closeStaffModal
  );

document
  .getElementById(
    "cancelModalBtn2"
  )
  ?.addEventListener(
    "click",
    closeStaffModal
  );

document
  .getElementById(
    "staffAvatarFile"
  )
  ?.addEventListener(
    "change",
    e => {

      const file =
        e.target.files[0];

      if (!file) return;

      document.getElementById(
        "fileNameLabel"
      ).textContent =
        file.name;

      const reader =
        new FileReader();

      reader.onload = () => {
        pendingAvatar =
          reader.result;
      };

      reader.readAsDataURL(file);
    }
  );

document
  .getElementById(
    "saveStaffBtn"
  )
  ?.addEventListener(
    "click",
    async () => {

      const nick =
        document.getElementById(
          "staffNick"
        ).value.trim();

      if (!nick) {
        alert(
          "Введите ник сотрудника."
        );
        return;
      }

      const ranks =
        [
          ...document.querySelectorAll(
            "#rankTags .tag-chip.active"
          )
        ].map(
          c => c.dataset.value
        );

      const positions =
        [
          ...document.querySelectorAll(
            "#roleTags .tag-chip.active"
          )
        ].map(
          c => c.dataset.value
        );

      const vk =
        document.getElementById(
          "staffVk"
        ).value.trim();

      const record = {
        nick,
        ranks,
        positions,
        vk,
        avatar: pendingAvatar
      };

      if (editIndex === null) {
        staffData.push(record);
      } else {
        staffData[editIndex] =
          record;
      }

      await saveServerData();

      closeStaffModal();
    }
  );

window.deleteStaff =
  async function(idx) {

    if (
      !confirm(
        "Удалить сотрудника?"
      )
    ) {
      return;
    }

    staffData.splice(
      idx,
      1
    );

    await saveServerData();
  };

window.editStaff =
  function(idx) {

    editIndex = idx;

    const item =
      staffData[idx];

    document.getElementById(
      "modalTitle"
    ).textContent =
      "Изменить сотрудника";

    document.getElementById(
      "staffNick"
    ).value =
      item.nick || "";

    document.getElementById(
      "staffVk"
    ).value =
      item.vk || "";

    pendingAvatar =
      item.avatar || null;

    document.getElementById(
      "fileNameLabel"
    ).textContent =
      pendingAvatar
        ? "Загружен аватар"
        : "Файл не выбран";

    setChipsActive(
      "rankTags",
      item.ranks ||
      (item.rank
        ? [item.rank]
        : [])
    );

    setChipsActive(
      "roleTags",
      item.positions ||
      (item.position
        ? [item.position]
        : [])
    );

    staffModal.classList.add(
      "open"
    );
  };

/* =========================================================
   СОАВТОРЫ
   ========================================================= */

function setSelected(
  container,
  values
) {

  if (!container) return;

  container
    .querySelectorAll(".chip")
    .forEach(c => {

      c.classList.toggle(
        "selected",
        values.includes(
          c.dataset.value
        )
      );

    });
}

function getSelected(
  container
) {

  if (!container) return [];

  return [
    ...container.querySelectorAll(
      ".chip.selected"
    )
  ].map(
    c => c.dataset.value
  );
}

function renderCoauthors() {

  const tbody =
    document.getElementById(
      "coauthorsList"
    );

  if (!tbody) return;

  if (
    !coauthorsData ||
    !coauthorsData.length
  ) {

    tbody.innerHTML = `
      <tr>
        <td colspan="5"
          style="
            text-align:center;
            color:var(--text-faint);
            padding:30px;
          ">
          Соавторы отсутствуют
        </td>
      </tr>
    `;

    return;
  }

  const permLabels = {

    staff:
      "Сотрудники",

    staff_add:
      "Добавить сотрудника",

    staff_actions:
      "Действия с сотрудниками",

    hydes:
      "Хайды",

    create_articles:
      "Создавать статьи",

    access:
      "Доступ",

    payments:
      "Мои выплаты"
  };

  tbody.innerHTML =
    coauthorsData.map(
      (c, idx) => {

        const perms =
          (c.permissions || [])
            .map(
              p =>
                permLabels[p] || p
            )
            .join(", ") ||
          "Нет доступов";

        const isBlocked =
          c.status === "blocked" ||
          c.status === "deleted";

        const statusHtml =
          isBlocked
            ? `
              <span class="status-pill blocked">
                Заблокирован
              </span>
            `
            : `
              <span class="status-pill active">
                Активен
              </span>
            `;

        const actionBtn =
          isBlocked
            ? `
              <button
                class="icon-btn success"
                onclick="activateCoauthor(${idx})">
                Активировать
              </button>
            `
            : `
              <button
                class="icon-btn warn"
                onclick="blockCoauthor(${idx})">
                Блокировать
              </button>
            `;

        return `
          <tr>

            <td>
              <strong>
                ${escapeHtml(c.login)}
              </strong>
            </td>

            <td>
              ${statusHtml}
            </td>

            <td>
              ${escapeHtml(perms)}
            </td>

            <td>
              <code>
                ${escapeHtml(
                  c.password ||
                  "******"
                )}
              </code>
            </td>

            <td>
              <div class="row-actions">

function getVisibleArticles() {

  const username =
    getUsername();

  return articlesData.filter(
    article => {

      /*
       * Опубликованные статьи
       * видят все сотрудники.
       */
      if (
        article.status ===
        "published"
      ) {
        return true;
      }

      /*
       * Черновик видит:
       * - администратор;
       * - автор черновика.
       */
      if (
        article.status ===
        "draft"
      ) {

        if (isAdmin()) {
          return true;
        }

        return (
          article.author ===
          username
        );
      }

      return false;
    }
  );
}

function renderArticles() {

  const container =
    document.getElementById(
      "articlesList"
    );

  if (!container) return;

  updateCreateArticleButton();

  const articles =
    getVisibleArticles();

  if (!articles.length) {

    container.innerHTML = `
      <div
        style="
          padding:45px 20px;
          text-align:center;
          color:var(--text-faint);
        "
      >

          style="

            margin-bottom:10px;
          "
        >
          📄
        </div>

        Статей пока нет.

      </div>
    `;

    return;
  }

  container.innerHTML =
    articles
      .sort(
        (a, b) =>
          new Date(
            b.updatedAt ||
            b.createdAt ||
            0
          ) -
          new Date(
            a.updatedAt ||
            a.createdAt ||
            0
          )
      )
      .map(
        article =>
          createArticleCard(
            article
          )
      )
      .join("");
}

/* =========================================================

async function saveArticle(
  status
) {

  if (
    !hasPermission(
      "create_articles"
    )
  ) {
    alert(
      "У вас нет разрешения «Создавать статьи»."
    );
    return;
  }

  const title =
    document.getElementById(
      "articleTitleInput"
    ).value.trim();

  const description =
    document.getElementById(
      "articleDescriptionInput"
    ).value.trim();

  const content =
    document.getElementById(
      "articleContentInput"
    ).value;

  if (!title) {

    alert(
      "Введите заголовок статьи."
    );

    return;
  }

  if (!content.trim()) {

    alert(
      "Введите текст статьи."
    );

    return;
  }

  for (
    const button of articleButtons
  ) {

    if (
      !button.text.trim()
    ) {

      alert(
        "У каждой кнопки должен быть указан текст."
      );

      return;
    }

    if (
      !button.copyText
    ) {

      alert(
        "Укажите текст, который будет копироваться кнопкой."
      );

      return;
    }
  }

  const now =
    new Date().toISOString();

  let article;

  if (
    editingArticleId
  ) {

    article =
      articlesData.find(
        a =>
          a.id ===
          editingArticleId
      );

    if (!article) {
      alert(
        "Статья не найдена."
      );
      return;
    }

    /*
     * Нельзя редактировать чужую
     * статью обычному сотруднику.
     */
    if (
      !isAdmin() &&
      article.author !==
        getUsername()
    ) {

      alert(
        "Вы можете изменять только свои статьи."
      );

      return;
    }

    article.title =
      title;

    article.description =
      description;

    article.content =
      content;

    article.buttons =
      articleButtons;

    article.status =
      status;

    article.updatedAt =
      now;

  } else {

    article = {

      id:
        generateId(),

      title,

      description,

      content,

      buttons:
        articleButtons,

      status,

      author:
        getUsername(),

      createdAt:
        now,

      updatedAt:
        now
    };

    articlesData.push(
      article
    );
  }

  await saveServerData();

  const overlay =
    document.getElementById(
      "articleEditorModal"
    );

  if (overlay) {
    overlay.classList.remove(
      "open"
    );
  }

  alert(
    status === "published"
      ? "Статья опубликована."
      : "Статья сохранена в черновики."
  );
}

/* =========================================================
   РЕДАКТИРОВАНИЕ СТАТЬИ
   ========================================================= */

window.editArticle =
  function(id) {

    const article =
      articlesData.find(
        a => a.id === id
      );

    if (!article) return;

    if (
      !isAdmin() &&
      article.author !==
        getUsername()
    ) {

      alert(
        "Вы можете изменять только свои статьи."
      );

      return;
    }

    editingArticleId =
      article.id;

    articleButtons =
      Array.isArray(
        article.buttons
      )
        ? JSON.parse(
            JSON.stringify(
              article.buttons
            )
          )
        : [];

    const overlay =
      createArticleEditorModal();

    document.getElementById(
      "articleEditorTitle"
    ).textContent =
      "Редактирование статьи";

    document.getElementById(
      "articleTitleInput"
    ).value =
      article.title || "";

    document.getElementById(
      "articleDescriptionInput"
    ).value =
      article.description || "";

    document.getElementById(
      "articleContentInput"
    ).value =
      article.content || "";

    renderArticleButtons();

    overlay.classList.add(
      "open"
    );
  };

/* =========================================================
   УДАЛЕНИЕ СТАТЬИ
   ========================================================= */

window.deleteArticle =
  async function(id) {

    const article =
      articlesData.find(
        a => a.id === id
      );

    if (!article) return;

    if (
      !isAdmin() &&
      article.author !==
        getUsername()
    ) {

      alert(
        "Вы можете удалять только свои статьи."
      );

      return;
    }

    if (
      !confirm(
        "Удалить эту статью?"
      )
    ) {
      return;
    }

    articlesData =
      articlesData.filter(
        a => a.id !== id
      );

    await saveServerData();
  };

/* =========================================================
   ПРОСМОТР СТАТЬИ
   ========================================================= */

window.openArticle =
  function(id) {

    const article =
      articlesData.find(
        a => a.id === id
      );

    if (!article) return;

    /*
     * Дополнительная проверка:
     * черновик нельзя открыть
     * чужому сотруднику.
     */
    if (
      article.status ===
        "draft" &&
      !isAdmin() &&
      article.author !==
        getUsername()
    ) {

      alert(
        "Этот материал находится в черновике."
      );

      return;
    }

    const overlay =
      document.createElement(
        "div"
      );

    overlay.className =
      "modal-overlay open";

    overlay.innerHTML = `
      <div
        class="modal"
        style="
          max-width:850px;
        "
      >

        <div class="modal-head">

          <div>

            <h3>
              ${escapeHtml(
                article.title
              )}
            </h3>

            ${
              article.description
                ? `
                  <p>
                    ${escapeHtml(
                      article.description
                    )}
                  </p>
                `
                : ""
            }

          </div>

          <button
            class="icon-btn del"
            style="
              border:none;
              background:none;
              font-size:16px;
            "
            onclick="
              this.closest('.modal-overlay').remove()
            "
          >
            ✕
          </button>

        </div>

        <div
          class="modal-body"
          style="
            padding-top:8px;
          "
        >

          <div
            style="
              color:var(--text-dim);
              font-size:.73rem;
              margin-bottom:18px;
            "
          >
            Автор:
            ${escapeHtml(
              article.author
            )}
            ·
            ${formatDate(
              article.updatedAt ||
              article.createdAt
            )}
          </div>

          <div
            style="
              white-space:pre-wrap;
              line-height:1.7;
              font-size:.92rem;
              color:var(--text);
            "
          >
            ${escapeHtml(
              article.content
            )}
          </div>

          ${
            article.buttons &&
            article.buttons.length
              ? `
                <div
                  style="
                    margin-top:25px;
                    display:flex;
                    flex-wrap:wrap;
                    gap:8px;
                  "
                >

                  ${article.buttons.map(
                    (button, index) => `
                      <button
                        class="add-btn"
                        onclick="
                          copyArticleButtonText(
                            ${JSON.stringify(
                              button.copyText
                            )},
                            this
                          )
                        "
                      >
                        ${escapeHtml(
                          button.text
                        )}
                      </button>
                    `
                  ).join("")}

                </div>
              `
              : ""
          }

        </div>

      </div>
    `;

    document.body.appendChild(
      overlay
    );
  };

/* =========================================================
   КОПИРОВАНИЕ ТЕКСТА КНОПКОЙ
   ========================================================= */

window.copyArticleButtonText =
  async function(
    text,
    button
  ) {

    /*
     * НИКАКОЙ проверки на URL нет.
     *
     * Можно указать:
     * https://google.com
     * google.com
     * abc123
     * /test
     * любой текст
     */

    try {

      await navigator.clipboard.writeText(
        String(text)
      );

      const oldText =
        button.textContent;

      button.textContent =
        "✓ Скопировано";

      setTimeout(() => {
        button.textContent =
          oldText;
      }, 1200);

    } catch (e) {

      /*
       * Запасной способ
       * для браузеров,
       * где Clipboard API
       * недоступен.
       */

      const textarea =
        document.createElement(
          "textarea"
        );

      textarea.value =
        String(text);

      textarea.style.position =
        "fixed";

      textarea.style.opacity =
        "0";

      document.body.appendChild(
        textarea
      );

      textarea.select();

      try {
        document.execCommand(
          "copy"
        );

        const oldText =
          button.textContent;

        button.textContent =
          "✓ Скопировано";

        setTimeout(() => {
          button.textContent =
            oldText;
        }, 1200);

      } catch {
        alert(
          "Не удалось скопировать текст."
        );
      }

      textarea.remove();
    }
  };

/* =========================================================
   СИНХРОНИЗАЦИЯ ПРАВ
   ========================================================= */

function refreshCurrentUserPermissions() {

  if (isAdmin()) return;

  const username =
    getUsername();

  const me =
    coauthorsData.find(
      c =>
        c.login === username
    );

  if (!me) return;

  localStorage.setItem(
    "ft_permissions",
    JSON.stringify(
      me.permissions || []
    )
  );

  applySidebarVisibility();
  updateCreateArticleButton();
}

/* =========================================================
   ДОПОЛНИТЕЛЬНО:
   если права были изменены,
   обновляем их после рендера.
   ========================================================= */

const originalRenderCoauthors =
  renderCoauthors;

renderCoauthors = function() {

  originalRenderCoauthors();

  refreshCurrentUserPermissions();
};

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */

addCreateArticlesPermissionToAccess();

if (
  document.getElementById(
    "view-hydes"
  )
) {
  buildHydesInterface();
}

</script>
